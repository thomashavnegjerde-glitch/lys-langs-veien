name: Add Svalbard panorama

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-svalbard.yml'

permissions:
  contents: write

jobs:
  build-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble optimized image
        run: |
          mkdir -p optimized
          cat .tmp-svalbard/part00 .tmp-svalbard/part01 .tmp-svalbard/part02 .tmp-svalbard/part03 | base64 --decode > optimized/Nordre-Isfjorden-Svalbard.webp
          file optimized/Nordre-Isfjorden-Svalbard.webp
          ls -lh optimized/Nordre-Isfjorden-Svalbard.webp

      - name: Clean temporary files
        run: |
          rm -rf .tmp-svalbard
          rm .github/workflows/add-svalbard.yml

      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Nordre Isfjorden panorama'
          git push
